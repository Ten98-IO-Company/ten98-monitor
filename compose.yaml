# Local development/evaluation recipe ONLY.
# - Plaintext env secrets are permitted for this initial dev recipe; Compose
#   does NOT encrypt source env. The backend supports _FILE inputs; this
#   development recipe uses generated .env values.
# - Web binds to 127.0.0.1; compose.caddy.yaml optionally adds HTTPS.
# - No container_name / external networks: run two instances with distinct
#   project names (docker compose -p <name>) without collisions.
#
# First run:
#   pnpm run setup:local                        # generates .env (32-byte hex values, refuses overwrite)
#   docker compose build
#   docker compose up -d web worker   # each applies pending migrations before starting (advisory-locked)
#
# MIGRATE_ON_START=false makes web and worker wait (up to 5 minutes) for an
# explicit `docker compose run --rm migrate`, e.g. after taking a backup.

x-app: &app
  image: ${TEN98_IMAGE:-ten98-monitor:foundation}
  build: .
  init: true # proper signal handling for graceful shutdown
  # Least privilege: the app runs as the image's unprivileged node user and writes only to /data/artifacts and /tmp.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    HOST: 0.0.0.0
    PORT: 3000
    # Compose injects its internal DB URL; the .env DATABASE_URL is for
    # host-local (non-Compose) dev only and is overridden here.
    DATABASE_URL: postgresql://ten98:${POSTGRES_PASSWORD}@postgres:5432/ten98
    APP_URL: ${APP_URL:-http://localhost:3000}
    AUTH_SECRET: ${AUTH_SECRET:?Run pnpm run setup:local first}
    CREDENTIAL_KEYS: ${CREDENTIAL_KEYS:-}
    CREDENTIAL_ACTIVE_KEY: ${CREDENTIAL_ACTIVE_KEY:-}
    ANALYTICS_NETWORK_MODE: ${ANALYTICS_NETWORK_MODE:-off}
    ANALYTICS_TRUSTED_PROXIES: ${ANALYTICS_TRUSTED_PROXIES:-}
    ANALYTICS_EXCLUDED_IPS: ${ANALYTICS_EXCLUDED_IPS:-}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    COLLECT_PATH_ALIAS: ${COLLECT_PATH_ALIAS:-}
    TRACKER_SCRIPT_ALIAS: ${TRACKER_SCRIPT_ALIAS:-}
    EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-disabled}
    EMAIL_FROM: ${EMAIL_FROM:-}
    EMAIL_FROM_FILE: ${EMAIL_FROM_FILE:-}
    EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
    EMAIL_SMTP_HOST_FILE: ${EMAIL_SMTP_HOST_FILE:-}
    EMAIL_SMTP_TLS: ${EMAIL_SMTP_TLS:-starttls}
    EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
    EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
    EMAIL_SMTP_USER_FILE: ${EMAIL_SMTP_USER_FILE:-}
    EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
    EMAIL_SMTP_PASSWORD_FILE: ${EMAIL_SMTP_PASSWORD_FILE:-}
    EMAIL_CLOUDFLARE_ACCOUNT_ID: ${EMAIL_CLOUDFLARE_ACCOUNT_ID:-}
    EMAIL_CLOUDFLARE_ACCOUNT_ID_FILE: ${EMAIL_CLOUDFLARE_ACCOUNT_ID_FILE:-}
    EMAIL_CLOUDFLARE_API_TOKEN: ${EMAIL_CLOUDFLARE_API_TOKEN:-}
    EMAIL_CLOUDFLARE_API_TOKEN_FILE: ${EMAIL_CLOUDFLARE_API_TOKEN_FILE:-}
    EMAIL_SES_REGION: ${EMAIL_SES_REGION:-}
    EMAIL_SES_ACCESS_KEY_ID: ${EMAIL_SES_ACCESS_KEY_ID:-}
    EMAIL_SES_ACCESS_KEY_ID_FILE: ${EMAIL_SES_ACCESS_KEY_ID_FILE:-}
    EMAIL_SES_SECRET_ACCESS_KEY: ${EMAIL_SES_SECRET_ACCESS_KEY:-}
    EMAIL_SES_SECRET_ACCESS_KEY_FILE: ${EMAIL_SES_SECRET_ACCESS_KEY_FILE:-}
    EMAIL_SES_CONFIGURATION_SET: ${EMAIL_SES_CONFIGURATION_SET:-}
    EMAIL_SES_SNS_TOPIC_ARNS: ${EMAIL_SES_SNS_TOPIC_ARNS:-}
    # Compose injects its internal artifact path; .env ARTIFACT_DIR is host-only.
    ARTIFACT_DIR: /data/artifacts
    MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
  depends_on:
    postgres:
      # Convenience only; app code handles its own schema readiness too.
      condition: service_healthy

services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: ten98
      POSTGRES_DB: ten98
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm run setup:local first}
    volumes:
      # PG18 image mountpoint (not the pre-18 /var/lib/postgresql/data).
      - pgdata:/var/lib/postgresql
    # No ports section: the DB is never published to the host.
    # The postgres entrypoint needs its default capabilities to prepare the data directory, so only this one applies.
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ten98 -d ten98"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G # dev guidance, not a capacity claim
          pids: 512

  web:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - artifacts:/data/artifacts
    healthcheck:
      # Local loopback fetch of the app's own readiness route only;
      # never calls anything external or paid.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M # dev guidance, not a capacity claim
          pids: 256

  worker:
    <<: *app
    command: ["node", "src/server/cli.ts", "worker"]
    volumes:
      - artifacts:/data/artifacts
    healthcheck:
      # diagnose exits non-zero when invalid/unready; prints no secrets.
      test: ["CMD", "node", "src/server/cli.ts", "diagnose", "worker"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M # dev guidance, not a capacity claim
          pids: 256

  migrate:
    <<: *app
    command: ["node", "src/server/cli.ts", "migrate"]
    profiles: ["tools"]
    restart: "no"
    # One-shot job: no healthcheck (image ships none), no artifacts volume.
    # Optional with MIGRATE_ON_START (default); required when it is false:
    #   docker compose run --rm migrate

volumes:
  pgdata:
  artifacts:
