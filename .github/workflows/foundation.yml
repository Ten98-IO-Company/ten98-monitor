            ]) {
              const database = new URL(process.env.DATABASE_URL);
              database.pathname = `/${name}`;
              for (const args of commands) {
                const result = spawnSync(process.execPath, args, {
                  env: { ...process.env, ...testEnv, DATABASE_URL: database.href }, stdio: 'inherit', timeout: 120_000,
                });
                if (result.status !== 0) {
                  console.error('Isolated database checks did not complete successfully.');
                  process.exitCode = 1;
                  break;
                }
              }
              if (process.exitCode) break;
            }
