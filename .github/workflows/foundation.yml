name: Foundation checks

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: ten98
          POSTGRES_DB: ten98_test
          # Only this fresh hosted-runner service uses trust, bound to loopback.
          # This is not a deployment configuration or a production auth example.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ten98 -d ten98_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_URL: http://localhost:3000
      BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgres://ten98@127.0.0.1:5432/ten98_test
      HOST: 127.0.0.1
      PORT: '3000'
      TEN98_INTEGRATION_TEST: '1'
      ANALYTICS_NETWORK_MODE: direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare isolated test configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync, mkdirSync } from 'node:fs';
          import { join } from 'node:path';
          for (const key of ['AUTH_SECRET']) {
            const value = randomBytes(32).toString('hex');
            console.log(`::add-mask::${value}`);
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          const credentialKey = randomBytes(32).toString('base64');
          console.log(`::add-mask::${credentialKey}`);
          appendFileSync(process.env.GITHUB_ENV, `CREDENTIAL_KEYS=${JSON.stringify({v1: credentialKey})}\nCREDENTIAL_ACTIVE_KEY=v1\n`);
          const artifacts = join(process.env.RUNNER_TEMP, 'ten98-foundation-artifacts');
          mkdirSync(artifacts, { recursive: true, mode: 0o700 });
          appendFileSync(process.env.GITHUB_ENV, `ARTIFACT_DIR=${artifacts}\n`);
          NODE
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and check
        shell: bash
        run: |
          pnpm build
          pnpm test
          node --test tests/replay-heatmap-overlay.test.mjs
          pnpm check:plan
      - name: Verify original-install upgrade, domain isolation and project content
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 5000 });
          try {
            await client.connect();
            await client.query('CREATE DATABASE ten98_upgrade');
            await client.query('CREATE DATABASE ten98_domains');
            await client.query('CREATE DATABASE ten98_context');
            await client.query('CREATE DATABASE ten98_paid');
            await client.query('CREATE DATABASE ten98_account_preferences_ci');
            await client.query('CREATE DATABASE ten98_password_recovery_ci');
